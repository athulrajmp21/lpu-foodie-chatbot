<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foodie chatbot</title>
</head>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        margin: 0;
        padding: 0;
    }

    h1 {
        text-align: center;
        color: #333;
    }

    #chat-container {
        width: 400px;
        margin: 20px auto;
        background-color: #fff;
        border-radius: 100px;
        padding: 20px;
    }

    #chat-box {
        height: 300px;
        overflow-y: auto;
        border: 1px solid #ccc;
        padding: 10px;
        margin-bottom: 10px;
        border-radius: 5px;
    }

    #user-input {
        width: calc(100% - 60px);
        padding: 10px;
        border-radius: 200px;
        border: 1px solid #ccc;
    }

    #send-button {
        width: 50px;
        padding: 10px;
        border-radius: 100px;
        border: none;
        background-color: #28a745;
        color: white;
        cursor: pointer;
    }

    #send-button:hover {
        background-color: #218838;
    }
</style>
<body>
    <h1>Foodie Chatbot</h1><hr>
    <div id="chat-container">
        <div id="chat-box"></div>
        <input type="text" id="user-input" placeholder="Type your message...">
        <button id="send-button">Send</button>
    </div>
    
</body>

</html>
